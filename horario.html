<!DOCTYPE html> 
<html lang="es"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">     
    <meta name="apple-mobile-web-app-capable" content="yes">     
    <meta name="apple-mobile-web-app-status-bar-style" content="default">     
    <meta name="apple-mobile-web-app-title" content="Horarios">     
    <link rel="apple-touch-icon" href="icono.png">     
    <link rel="icon" type="image/png" href="icono.png">     
    <link rel="manifest" href="manifest.json">          
    <title>Horarios - Mi Espacio</title>     
    <style>         
        :root {             
            /* Paleta de colores Retro Pop */             
            --bg-main: #dbe9d0c4;             
            --dark-green: #0C493D;             
            --lavender: #A18CEE;             
            --mint-green: #9CF6A8;             
            --peach-orange: #FA8E62;             
            --pale-yellow: #FDF1C2;             
            --pastel-pink: #FFB3C6;             
            --text-dark: #1A1C1A;             
            --text-light: #FFFFFF;         
        }         
        * {             
            margin: 0;             
            padding: 0;             
            box-sizing: border-box;             
            -webkit-tap-highlight-color: transparent;         
        }         
        body {             
            background-color: var(--bg-main);             
            color: var(--text-dark);             
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;             
            min-height: 100vh;             
            display: flex;             
            flex-direction: column;             
            align-items: center;             
            overflow-x: hidden;         
        }         
        /* --- Barra Superior --- */         
        .top-bar {             
            width: 100%;             
            background-color: transparent;             
            padding: calc(20px + env(safe-area-inset-top)) 20px 15px;             
            display: flex;             
            justify-content: center;             
            align-items: center;             
            position: sticky;             
            top: 0;             
            z-index: 30;             
            backdrop-filter: blur(10px);             
            -webkit-backdrop-filter: blur(10px);         
        }         
        .top-bar .page-title {             
            font-family: "Georgia", serif;             
            font-size: 1.35rem;             
            font-weight: 800;             
            color: var(--dark-green);         
        }         
        /* --- Contenedor Principal --- */         
        .container {             
            width: 100%;             
            max-width: 420px;             
            padding: 10px 20px calc(130px + env(safe-area-inset-bottom));             
            display: flex;             
            flex-direction: column;         
        }         
        /* --- WIDGET BENTO: Estado en Vivo --- */         
        .live-status-bento {             
            background-color: var(--text-light);             
            border-radius: 32px;             
            padding: 22px;             
            display: flex;             
            flex-direction: column;             
            margin-bottom: 25px;             
            position: relative;         
        }         
        .live-header {             
            display: flex;             
            align-items: center;             
            gap: 8px;             
            margin-bottom: 15px;             
            font-size: 0.8rem;             
            font-weight: 800;             
            text-transform: uppercase;             
            letter-spacing: 1px;             
            color: var(--dark-green);         
        }         
        .pulsing-dot {             
            width: 10px;             
            height: 10px;             
            background-color: var(--mint-green);             
            border-radius: 50%;             
            border: 2px solid var(--dark-green);             
            animation: pulse 1.5s infinite;         
        }         
        @keyframes pulse {             
            0% { box-shadow: 0 0 0 0 rgba(156, 246, 168, 0.7); }             
            70% { box-shadow: 0 0 0 8px rgba(156, 246, 168, 0); }             
            100% { box-shadow: 0 0 0 0 rgba(156, 246, 168, 0); }         
        }         
        .status-columns {             
            display: flex;             
            gap: 12px;         
        }         
        .status-col {             
            flex: 1;             
            border-radius: 20px;             
            padding: 16px 12px;             
            display: flex;             
            flex-direction: column;             
            align-items: center;             
            gap: 10px;         
        }         
        .status-col.yo { background-color: var(--pale-yellow); }         
        .status-col.vanessa { background-color: var(--pastel-pink); }         
        .status-name {             
            font-family: "Georgia", serif;             
            font-weight: 800;             
            font-size: 1.1rem;             
            color: var(--text-dark);         
        }         
        .status-current {             
            background-color: var(--text-dark);             
            color: var(--mint-green);             
            font-weight: 800;             
            font-size: 0.8rem;             
            padding: 6px 14px;             
            border-radius: 16px;             
            text-transform: uppercase;             
            text-align: center;             
            width: 100%;             
            white-space: nowrap;             
            overflow: hidden;             
            text-overflow: ellipsis;         
        }         
        .status-col.vanessa .status-current { color: var(--pastel-pink); }         
        .status-detail {             
            font-size: 0.7rem;             
            font-weight: 600;             
            color: rgba(26, 28, 26, 0.7);             
            display: flex;             
            flex-direction: column;             
            align-items: center;             
            text-align: center;             
            gap: 4px;             
            width: 100%;         
        }         
        .status-detail span {             
            font-weight: 800;             
            font-size: 0.85rem;             
            color: var(--text-dark);         
        }         

        /* --- Selector de Días --- */         
        .week-selector {             
            display: flex;             
            justify-content: space-between;             
            margin-bottom: 25px;             
            background-color: rgba(255, 255, 255, 0.5);             
            padding: 8px;             
            border-radius: 24px;         
        }         
        .day-pill {             
            display: flex;             
            flex-direction: column;             
            align-items: center;             
            justify-content: center;             
            width: 48px;             
            height: 60px;             
            border-radius: 18px;             
            color: rgba(26, 28, 26, 0.5);             
            font-weight: 700;             
            font-size: 0.95rem;             
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);             
            cursor: pointer;         
        }         
        .day-pill.active {             
            background-color: var(--text-dark);             
            color: var(--mint-green);             
            transform: scale(1.05);             
            box-shadow: 0px 8px 15px rgba(0,0,0,0.1);         
        }         
        .day-pill span {             
            font-size: 0.7rem;             
            margin-bottom: 3px;             
            text-transform: uppercase;         
        }         

        /* --- CALENDARIO GRID CON ESPACIOS VACÍOS --- */
        .schedule-day-view {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            padding: 20px 15px 20px 5px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
        }
        .col-header-titles {
            display: grid;
            grid-template-columns: 50px 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .col-title {
            text-align: center;
            font-family: "Georgia", serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--dark-green);
            background: var(--text-light);
            padding: 10px 5px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .grid-body {
            display: flex;
            position: relative;
        }
        .timeline-labels {
            width: 50px;
            display: flex;
            flex-direction: column;
        }
        .time-label {
            height: 80px; /* Altura de 1 hora */
            text-align: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: rgba(26, 28, 26, 0.6);
            transform: translateY(-8px);
        }
        .columns-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            position: relative;
        }
        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .grid-line {
            height: 80px;
            border-top: 1px dashed rgba(26, 28, 26, 0.15);
        }
        .schedule-col {
            position: relative;
            z-index: 1;
        }
        .task-card.absolute {
            position: absolute;
            width: 100%;
            left: 0;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            text-align: center;
            transition: transform 0.2s;
        }
        .task-card.absolute:active { transform: scale(0.95); }
        
        .task-title {
            font-size: 0.75rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.2px;
            color: var(--text-dark);
        }
        .room-name {
            font-size: 0.7rem;
            font-weight: 800;
            opacity: 0.5;
            margin-top: 4px;
            font-style: italic;
        }
        /* Icono gigante de fondo translúcido */
        .watermark {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 70px;
            height: 70px;
            opacity: 0.1;
            transform: rotate(-10deg);
            pointer-events: none;
            z-index: 0;
        }

        /* --- Barra Inferior Flotante (Dock) --- */         
        .bottom-nav {             
            position: fixed;             
            bottom: calc(20px + env(safe-area-inset-bottom));             
            left: 50%;             
            transform: translateX(-50%);             
            width: calc(100% - 30px);             
            max-width: 380px;             
            background-color: var(--text-light);             
            border: 3px solid var(--text-dark);             
            border-radius: 40px;             
            display: flex;             
            justify-content: space-between;             
            align-items: center;             
            padding: 6px 15px;             
            box-shadow: 6px 6px 0px var(--text-dark);             
            z-index: 100;         
        }         
        .nav-item { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 16px; color: var(--text-dark); opacity: 0.5; text-decoration: none; transition: all 0.2s; }         
        .nav-item:active { opacity: 1; transform: scale(0.9); }                  
        .nav-item.home-btn {             
            width: 60px; height: 60px; border-radius: 50%; background-color: var(--peach-orange); color: var(--text-dark); opacity: 1; border: 3px solid var(--text-dark); box-shadow: 0px 4px 0px var(--text-dark); transform: translateY(-12px); flex-shrink: 0;         
        }         
        .nav-item.home-btn:active { transform: translateY(-8px); box-shadow: 0px 0px 0px var(--text-dark); }         
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }     
    </style> 
</head> 
<body>     
    <nav class="top-bar">         
        <div class="page-title">Horarios</div>     
    </nav>     
    <div class="container">         
        <div class="live-status-bento">             
            <div class="live-header">                 
                <div class="pulsing-dot"></div>                 
                Estado Actual             
            </div>             
            <div class="status-columns">                 
                <div class="status-col yo">                     
                    <div class="status-name">Yo</div>                     
                    <div class="status-current" id="yo-status">Calculando...</div>                     
                    <div class="status-detail">                         
                        <div>Termina en:<br><span id="yo-time-end">--</span></div>                         
                        <div style="margin-top: 4px;">Siguiente:<br><span id="yo-time-next">--</span></div>                     
                    </div>                 
                </div>                                  
                <div class="status-col vanessa">                     
                    <div class="status-name">Vanessa</div>                     
                    <div class="status-current" id="van-status">Calculando...</div>                     
                    <div class="status-detail">                         
                        <div>Termina en:<br><span id="van-time-end">--</span></div>                         
                        <div style="margin-top: 4px;">Siguiente:<br><span id="van-time-next">--</span></div>                     
                    </div>                 
                </div>             
            </div>         
        </div>                  
        
        <div class="week-selector" id="week-selector">             
            <div class="day-pill" data-day="1"><span>L</span> 6</div>             
            <div class="day-pill active" data-day="2"><span>M</span> 7</div>             
            <div class="day-pill" data-day="3"><span>M</span> 8</div>             
            <div class="day-pill" data-day="4"><span>J</span> 9</div>             
            <div class="day-pill" data-day="5"><span>V</span> 10</div>             
        </div>         

        <!-- CONTENEDOR TIPO CALENDARIO -->
        <div class="schedule-day-view">
            <div class="col-header-titles">
                <div style="font-size: 0.65rem; text-align: center; font-weight: 800; color: var(--dark-green); align-self: end; padding-bottom: 5px; opacity: 0.7;">HORAS</div>
                <div class="col-title">Yo</div>
                <div class="col-title">Vanessa</div>
            </div>
            <div class="grid-body">
                <div class="timeline-labels" id="timeline-labels"></div>
                <div class="columns-container">
                    <div class="grid-lines" id="grid-lines"></div>
                    <div class="schedule-col" id="col-yo"></div>
                    <div class="schedule-col" id="col-vanessa"></div>
                </div>
            </div>
        </div>

    </div>     
    <nav class="bottom-nav">         
        <a href="dinero.html" class="nav-item"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></a>         
        <a href="notas.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></a>         
        <a href="index.html" class="nav-item home-btn"><svg viewBox="0 0 24 24" style="stroke: var(--text-dark);"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>         
        <a href="track.html" class="nav-item"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></a>         
        <a href="meta.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></a>     
    </nav>     

    <script>         
        const watermarkEscuela = `<svg class="watermark" viewBox="0 0 24 24" stroke="var(--text-dark)" stroke-width="1" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;

        // --- BASES DE DATOS DE HORARIOS CORREGIDA ---
        const dbGenaro = {
            1: [{ s: 14, d: 2, n: "CONTAB FINANC. (E7)" }, { s: 19, d: 2, n: "EST DATOS (ED12)" }], 
            2: [{ s: 14, d: 2, n: "INV. DE OPERAC. (ED12)" }, { s: 17, d: 1, n: "PROB Y ESTAD. (ED12)" }, { s: 20, d: 1, n: "EST DATOS (ED12)" }], 
            3: [{ s: 14, d: 2, n: "CONTAB FINANC. (E7)" }, { s: 17, d: 2, n: "PROB Y ESTAD. (ED12)" }, { s: 19, d: 2, n: "EST DATOS (ED12)" }], 
            4: [{ s: 14, d: 2, n: "INV. DE OPERAC. (ED12)" }, { s: 17, d: 1, n: "PROB Y ESTAD. (ED12)" }], 
            5: [{ s: 18, d: 1, n: "PROB Y ESTAD. (ED12)" }], 
            0: [] 
        };

        const dbVanesa = {
            1: [{ s: 14, d: 2, n: "INVESTIG. DE OPERAC. (U6)" }, { s: 16, d: 1, n: "INSTRUM. DE PRES. EMPRES. (U6)" }, { s: 17, d: 1, n: "ENTORNO MACROECON. (U6)" }, { s: 18, d: 2, n: "ESTAD. INFER. I (U6)" }, { s: 20, d: 1, n: "EL EMP. Y LA INNOV (U6)" }], 
            2: [{ s: 14, d: 2, n: "HAB DIRECTIVAS II (U6)" }, { s: 16, d: 1, n: "ESTAD. INFER. I (U6)" }, { s: 17, d: 1, n: "INSTRUM. DE PRES. EMPRES. (U6)" }, { s: 18, d: 2, n: "ING. ECONOMICA (U6)" }, { s: 20, d: 1, n: "ENTORNO MACROECON. (U6)" }],
            3: [{ s: 14, d: 2, n: "INVESTIG. DE OPERAC. (U6)" }, { s: 16, d: 2, n: "INSTRUM. DE PRES. EMPRES. (U6)" }, { s: 18, d: 1, n: "ESTAD. INFER. I (U6)" }, { s: 19, d: 1, n: "ENTORNO MACROECON. (U6)" }, { s: 20, d: 1, n: "EL EMP. Y LA INNOV (U6)" }],
            4: [{ s: 14, d: 2, n: "HAB DIRECTIVAS II (U6)" }, { s: 16, d: 1, n: "INSTRUM. DE PRES. EMPRES. (U6)" }, { s: 17, d: 1, n: "ENTORNO MACROECON. (U6)" }, { s: 18, d: 2, n: "ING. ECONOMICA (U6)" }, { s: 20, d: 1, n: "EL EMP. Y LA INNOV (U6)" }],
            5: [{ s: 14, d: 1, n: "ENTORNO MACROECON. (U6)" }, { s: 15, d: 1, n: "INVESTIG. DE OPERAC. (U6)" }, { s: 16, d: 1, n: "ING. ECONOMICA (U6)" }, { s: 17, d: 2, n: "ESTAD. INFER. I (U6)" }, { s: 19, d: 2, n: "EL EMP. Y LA INNOV (U6)" }],
            0: [] 
        };

        // --- SISTEMA DE COLORES AUTOMÁTICO ---
        const palette = [
            "var(--lavender)",    
            "var(--mint-green)",  
            "var(--peach-orange)",
            "var(--pale-yellow)", 
            "var(--pastel-pink)", 
            "#90CDF4",            
            "#F6AD55",            
            "#F687B3"             
        ];
        const subjectColors = {};
        let colorIdx = 0;
        
        function getColor(name) {
            const baseName = name.split(' (')[0]; 
            if (!subjectColors[baseName]) {
                subjectColors[baseName] = palette[colorIdx % palette.length];
                colorIdx++;
            }
            return subjectColors[baseName];
        }

        const colYo = document.getElementById('col-yo');
        const colVanessa = document.getElementById('col-vanessa');
        const dayPills = document.querySelectorAll('.day-pill');

        // Formato para 1:00 PM, 2:00 PM
        function formatHourLabel(h) {
            let ampm = h >= 12 ? 'PM' : 'AM';
            let h12 = h % 12 || 12;
            return `${h12}:00 <span style="font-size:0.55rem">${ampm}</span>`;
        }

        function formatTimeDiff(diffHours) {
            let totalMinutes = Math.round(diffHours * 60);
            let h = Math.floor(totalMinutes / 60);
            let m = totalMinutes % 60;
            if (h > 0 && m > 0) return `${h}h ${m}m`;
            if (h > 0 && m === 0) return `${h}h`;
            return `${m} min`;
        }

        function getAbsoluteCardsHTML(events, minHour, hourHeight) {
            let html = '';
            events.forEach(ev => {
                const bgColor = getColor(ev.n);
                const top = (ev.s - minHour) * hourHeight;
                const height = ev.d * hourHeight;
                
                const parts = ev.n.split(' (');
                const subjectName = parts[0];
                const roomName = parts.length > 1 ? `"${parts[1].replace(')', '')}"` : '';

                html += `
                <div class="task-card absolute" style="background-color: ${bgColor}; top: ${top}px; height: ${height}px;">
                    ${watermarkEscuela}
                    <div class="task-title">${subjectName}</div>
                    <div class="room-name">${roomName}</div>
                </div>`;
            });
            return html;
        }

        // DIBUJAR LA CUADRÍCULA Y LAS MATERIAS
        function updateSchedule(dayNum) {
            const evsYo = dbGenaro[dayNum] || [];
            const evsVan = dbVanesa[dayNum] || [];
            
            let minHour = 24;
            let maxHour = 0;
            
            const allEvs = [...evsYo, ...evsVan];
            if(allEvs.length === 0) {
                minHour = 14; 
                maxHour = 16;
            } else {
                allEvs.forEach(e => {
                    if (e.s < minHour) minHour = Math.floor(e.s);
                    if ((e.s + e.d) > maxHour) maxHour = Math.ceil(e.s + e.d);
                });
            }
            
            minHour = Math.max(8, minHour - 1); 
            maxHour = Math.min(24, maxHour + 1);
            
            const hourHeight = 80; 
            const totalHours = maxHour - minHour;
            
            let labelsHTML = '';
            let linesHTML = '';
            for(let h = minHour; h <= maxHour; h++) {
                labelsHTML += `<div class="time-label">${formatHourLabel(h)}</div>`;
                linesHTML += `<div class="grid-line"></div>`;
            }
            
            document.getElementById('timeline-labels').innerHTML = labelsHTML;
            document.getElementById('grid-lines').innerHTML = linesHTML;
            
            const containerHeight = totalHours * hourHeight;
            colYo.style.height = `${containerHeight}px`;
            colVanessa.style.height = `${containerHeight}px`;
            
            colYo.innerHTML = getAbsoluteCardsHTML(evsYo, minHour, hourHeight);
            colVanessa.innerHTML = getAbsoluteCardsHTML(evsVan, minHour, hourHeight);
        }

        // --- SISTEMA DE SELECCIÓN DE DÍAS (L a V) ---
        dayPills.forEach((pill, index) => {
            pill.addEventListener('click', () => {
                dayPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                updateSchedule(index + 1); // 1 a 5
            });
        });

        // Configuración inicial del día actual
        let currentDay = new Date().getDay();
        if (currentDay === 0) currentDay = 1; 
        
        dayPills.forEach(p => p.classList.remove('active'));
        if(currentDay >= 1 && currentDay <= 5) {
            dayPills[currentDay - 1].classList.add('active');
        } else {
            dayPills[0].classList.add('active');
        }
        updateSchedule(currentDay);

        // --- LÓGICA DE ESTADO EN VIVO ---
        function getLiveStatusInfo(events, currentHour) {
            if (!events || events.length === 0) return { status: 'Libre', end: '--', next: '--' };
            const sorted = [...events].sort((a,b) => a.s - b.s);
            const cur = sorted.find(e => currentHour >= e.s && currentHour < (e.s + e.d));
            const nxt = sorted.find(e => e.s > currentHour);

            if (cur) {
                return {
                    status: 'En Clase',
                    end: formatTimeDiff(cur.s + cur.d - currentHour),
                    next: nxt ? formatTimeDiff(nxt.s - currentHour) + " (" + nxt.n.split(' (')[0] + ")" : 'Libre después'
                };
            } else if (nxt) {
                return {
                    status: 'Esperando',
                    end: '--',
                    next: formatTimeDiff(nxt.s - currentHour) + " (" + nxt.n.split(' (')[0] + ")"
                };
            } else {
                return { status: 'Libre', end: '--', next: 'Hasta mañana' };
            }
        }

        function updateLiveStatus() {
            const now = new Date();
            const day = now.getDay(); 
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTime = hours + (minutes / 60);
            
            const yoStatusInfo = getLiveStatusInfo(dbGenaro[day], currentTime);
            const vanStatusInfo = getLiveStatusInfo(dbVanesa[day], currentTime);

            document.getElementById('yo-status').textContent = yoStatusInfo.status;
            document.getElementById('yo-time-end').textContent = yoStatusInfo.end;
            document.getElementById('yo-time-next').textContent = yoStatusInfo.next;

            document.getElementById('van-status').textContent = vanStatusInfo.status;
            document.getElementById('van-time-end').textContent = vanStatusInfo.end;
            document.getElementById('van-time-next').textContent = vanStatusInfo.next;
        }

        updateLiveStatus();
        setInterval(updateLiveStatus, 60000);

        // --- REGISTRO DEL SERVICE WORKER (SOPORTE OFFLINE) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker cargado con éxito', reg))
                    .catch(err => console.log('Error al registrar Service Worker', err));
            });
        }
    </script> 
</body> 
</html>
